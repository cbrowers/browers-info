server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Behind Traefik: never emit redirects with the internal port/scheme
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml
               application/rss+xml image/svg+xml text/plain;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # giscus theme CSS is loaded by the giscus.app iframe → allow that origin.
    # ^~ so the long-cache regex below doesn't take over (URL carries ?v=<sha>).
    location ^~ /giscus/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "https://giscus.app";
        add_header Cache-Control "public, max-age=3600";
    }

    # Hugo fingerprints CSS/JS bundles → safe to cache long
    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|webp|avif|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
