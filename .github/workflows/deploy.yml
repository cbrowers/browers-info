name: Build & publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # daily rebuild → publishes future-dated posts

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build metadata
        id: meta
        env:
          PUSHED_AT: ${{ github.event.repository.pushed_at }}   # unix time, push events only
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$PUSHED_AT" ]; then
            when="$(TZ=Europe/Berlin date -d "@$PUSHED_AT" '+%-d %b %Y, %H:%M %Z')"
          else
            when="$(TZ=Europe/Berlin date -d "$(git log -1 --format=%cI)" '+%-d %b %Y, %H:%M %Z')"
          fi
          echo "when=$when" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs: build only (catches broken markdown/shortcodes). main: build + push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/cbrowers/browers-info:latest
            ghcr.io/cbrowers/browers-info:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.when }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
